asi."}, {"id": 116, "d": 4, "src": "G", "t": "Denial of Service (DoS)", "def": "Mencegah akses sah ke sumber daya atau memperlambat operasi yang kritis waktu."}, {"id": 117, "d": 4, "src": "G", "t": "Fragment attack", "def": "Memecah trafik sedemikian rupa sehingga sistem penerima gagal menyusun kembali paketnya."}, {"id": 118, "d": 4, "src": "G", "t": "Oversized packet attack", "def": "Mengirim paket yang lebih besar dari yang bisa ditangani penerima agar sistemnya gagal."}, {"id": 119, "d": 4, "src": "G", "t": "Man-in-the-middle", "def": "Penyerang berada di antara pengguna dan sistem untuk menyadap atau mengubah data."}, {"id": 120, "d": 4, "src": "G", "t": "Spoofing", "def": "Memalsukan alamat pengirim untuk menyusup ke sistem."}, {"id": 121, "d": 4, "src": "G", "t": "Firewall", "def": "Perangkat yang memfilter trafik berdasarkan aturan untuk menegakkan kebijakan keamanan."}, {"id": 122, "d": 4, "src": "G", "t": "VPN", "def": "Jalur komunikasi aman (terenkripsi) yang dibangun di atas jaringan yang sudah ada."}, {"id": 123, "d": 4, "src": "G", "t": "VLAN", "def": "Pengelompokan logis perangkat seolah berada di LAN yang sama, untuk segmentasi."}, {"id": 124, "d": 4, "src": "G", "t": "WLAN", "def": "Jaringan lokal berbasis gelombang radio; Wi-Fi adalah salah satu jenisnya."}, {"id": 125, "d": 4, "src": "N", "t": "WPA3", "def": "Standar keamanan Wi-Fi terkini dan paling kuat; WEP sudah tidak aman."}, {"id": 126, "d": 4, "src": "N", "t": "Bluesnarfing vs bluejacking", "def": "Bluesnarfing mencuri data lewat Bluetooth; bluejacking hanya mengirim pesan tak diminta."}, {"id": 127, "d": 4, "src": "N", "t": "ICS / IoT security", "def": "Ganti kredensial default, update firmware, dan isolasi perangkat yang tidak bisa di-patch."}, {"id": 128, "d": 4, "src": "N", "t": "DMZ (screened subnet)", "def": "Zona terpisah untuk server yang diakses publik, agar jaringan internal tetap terlindungi."}, {"id": 129, "d": 4, "src": "G", "t": "Microsegmentation", "def": "Bagian dari zero trust: memecah jaringan menjadi zona sangat kecil dengan firewall di tiap titik."}, {"id": 130, "d": 4, "src": "G", "t": "Defense in depth / layered defense", "def": "Banyak lapis kontrol (orang, teknologi, operasi) agar satu kontrol gagal tidak membuka semuanya."}, {"id": 131, "d": 4, "src": "G", "t": "Zero trust", "def": "Tidak ada area jaringan yang dipercaya otomatis; setiap akses diverifikasi di tingkat paling granular."}, {"id": 132, "d": 4, "src": "G", "t": "Nmap / Zenmap", "def": "Pemindai jaringan untuk menemukan perangkat dan layanan; Zenmap adalah tampilan grafisnya."}, {"id": 133, "d": 5, "src": "G", "t": "Event", "def": "Kejadian apa pun yang bisa diamati di jaringan atau sistem."}, {"id": 134, "d": 5, "src": "G", "t": "Adverse event", "def": "Event dengan akibat negatif, misalnya sistem crash, banjir paket, atau malware yang menghapus data."}, {"id": 135, "d": 5, "src": "G", "t": "Incident", "def": "Event yang benar-benar atau berpotensi mengancam CIA sistem atau informasinya."}, {"id": 136, "d": 5, "src": "G", "t": "Breach", "def": "Hilangnya kendali atau pengungkapan tidak sah sehingga PII diakses pihak yang tidak berwenang atau untuk tujuan tidak sah."}, {"id": 137, "d": 5, "src": "G", "t": "Intrusion", "def": "Penyusup mendapat atau mencoba mendapat akses ke sistem tanpa izin."}, {"id": 138, "d": 5, "src": "G", "t": "Exploit", "def": "Serangan tertentu yang memanfaatkan kerentanan sistem."}, {"id": 139, "d": 5, "src": "G", "t": "Zero day", "def": "Kerentanan yang belum diketahui publik, sehingga belum ada deteksi atau patch."}, {"id": 140, "d": 5, "src": "G", "t": "Payload", "def": "Bagian malware yang menjalankan aksi utamanya."}, {"id": 141, "d": 5, "src": "G", "t": "Ransomware", "def": "Malware yang mengunci layar atau file sampai korban membayar tebusan."}, {"id": 142, "d": 5, "src": "G", "t": "Insider threat", "def": "Pihak dengan akses sah yang berpotensi merusak, membocorkan, atau mengganggu sistem."}, {"id": 143, "d": 5, "src": "G", "t": "Incident response plan (IRP)", "def": "Prosedur tertulis untuk mendeteksi, merespons, dan membatasi dampak serangan siber."}, {"id": 144, "d": 5, "src": "N", "t": "IR phases", "def": "Preparation, detection and analysis, containment-eradication-recovery, post-incident (lessons learned)."}, {"id": 145, "d": 5, "src": "N", "t": "Tabletop exercise", "def": "Latihan IR berbasis diskusi: tim membahas skenario tanpa menyentuh sistem produksi."}, {"id": 146, "d": 5, "src": "G", "t": "Security operations center (SOC)", "def": "Tim terpusat yang memantau, mendeteksi, dan menganalisis event untuk mencegah gangguan bisnis."}, {"id": 147, "d": 5, "src": "G", "t": "Logging", "def": "Mengumpulkan dan menyimpan catatan aktivitas yang terjadi di sistem dan jaringan."}, {"id": 148, "d": 5, "src": "G", "t": "Log anomaly", "def": "Ketidakwajaran di log yang patut diselidiki lebih lanjut."}, {"id": 149, "d": 5, "src": "N", "t": "SIEM", "def": "Sistem yang mengumpulkan, mengorelasikan, dan menganalisis log dari banyak sumber."}, {"id": 150, "d": 5, "src": "N", "t": "Triage", "def": "Memprioritaskan event berdasarkan kekritisan aset dan dampaknya."}, {"id": 151, "d": 5, "src": "N", "t": "Threat intelligence (CTI)", "def": "Informasi tentang ancaman dan indikatornya (IP, hash, domain) untuk membantu deteksi dan pencegahan."}, {"id": 152, "d": 5, "src": "N", "t": "MITRE ATT&CK", "def": "Basis pengetahuan taktik dan teknik penyerang yang teramati di serangan nyata."}, {"id": 153, "d": 5, "src": "G", "t": "Ingress / egress monitoring", "def": "Memantau trafik masuk (ingress) dan keluar (egress) jaringan."}, {"id": 154, "d": 5, "src": "G", "t": "Data loss prevention (DLP)", "def": "Kemampuan sistem untuk mendeteksi dan mencegah penggunaan atau pengiriman data tanpa izin."}, {"id": 155, "d": 5, "src": "G", "t": "Classification", "def": "Menentukan tingkat kerugian jika informasi bocor, untuk menentukan perlindungannya; fokus utamanya confidentiality."}, {"id": 156, "d": 5, "src": "N", "t": "Data masking", "def": "Menyembunyikan sebagian data dari yang tidak perlu melihatnya, misalnya hanya menampilkan 4 digit terakhir kartu."}, {"id": 157, "d": 5, "src": "G", "t": "Records retention", "def": "Menyimpan catatan selama diperlukan, lalu memusnahkannya sesuai jadwal."}, {"id": 158, "d": 5, "src": "G", "t": "Remanence", "def": "Sisa data yang masih tertinggal di media penyimpanan setelah dihapus."}, {"id": 159, "d": 5, "src": "G", "t": "Degaussing", "def": "Menghapus data di media magnetik dengan medan magnet kuat agar tidak bisa direkonstruksi."}, {"id": 160, "d": 5, "src": "G", "t": "Plaintext", "def": "Data dalam bentuk asli yang bisa dibaca; sangat rentan dari sisi kerahasiaan."}, {"id": 161, "d": 5, "src": "G", "t": "Ciphertext", "def": "Data yang sudah diubah sehingga tidak terbaca kecuali oleh penerima yang berhak."}, {"id": 162, "d": 5, "src": "G", "t": "Encryption / decryption", "def": "Mengubah plaintext menjadi ciphertext (enkripsi) dan sebaliknya (dekripsi) dengan algoritma dan kunci."}, {"id": 163, "d": 5, "src": "G", "t": "Symmetric encryption", "def": "Kunci yang sama dipakai untuk enkripsi dan dekripsi (misalnya AES); tantangannya distribusi kunci."}, {"id": 164, "d": 5, "src": "G", "t": "Asymmetric encryption", "def": "Satu kunci untuk enkripsi dan kunci pasangannya untuk dekripsi (public dan private key, misalnya RSA)."}, {"id": 165, "d": 5, "src": "G", "t": "Hash function / hashing", "def": "Algoritma satu arah yang menghasilkan nilai unik dari data, seperti sidik jari file; untuk integrity."}, {"id": 166, "d": 5, "src": "G", "t": "Message digest", "def": "Nilai hasil hash; mengubah satu bit data saja akan menghasilkan digest yang sama sekali berbeda."}, {"id": 167, "d": 5, "src": "G", "t": "Checksum", "def": "Nilai hasil perhitungan dari data untuk mendeteksi kesalahan saat disimpan atau dikirim."}, {"id": 168, "d": 5, "src": "G", "t": "Digital signature", "def": "Hasil kriptografi yang memberi autentikasi asal, integritas data, dan non-repudiation."}, {"id": 169, "d": 5, "src": "G", "t": "Cryptanalyst", "def": "Orang yang mempelajari cara mengalahkan teknik kriptografi atau mencari kelemahannya."}, {"id": 170, "d": 5, "src": "N", "t": "Quantum-resistant cryptography", "def": "Algoritma yang dirancang tahan terhadap komputer kuantum, yang kelak bisa memecahkan RSA dan ECC."}, {"id": 171, "d": 5, "src": "G", "t": "Hardening", "def": "Menerapkan konfigurasi aman untuk memperkecil attack surface, biasanya mengacu pada benchmark seperti CIS."}, {"id": 172, "d": 5, "src": "G", "t": "Configuration management", "def": "Memastikan hanya perubahan yang sudah disetujui dan divalidasi yang masuk ke sistem."}, {"id": 173, "d": 5, "src": "G", "t": "Request for change (RFC)", "def": "Tahap pertama change management: pemangku kepentingan mengajukan perubahan."}, {"id": 174, "d": 5, "src": "G", "t": "Patch / patch management", "def": "Patch adalah perbaikan software; patch management adalah proses identifikasi, distribusi, instalasi, dan verifikasinya."}, {"id": 175, "d": 5, "src": "N", "t": "End of Life (EOL)", "def": "Software atau perangkat yang tidak lagi mendapat patch dari vendor; harus diganti, di-upgrade, atau diisolasi."}, {"id": 176, "d": 5, "src": "N", "t": "Red / blue / purple team", "def": "Red menyerang, blue bertahan, purple keduanya bekerja sama memperbaiki deteksi."}, {"id": 177, "d": 5, "src": "N", "t": "SAST vs DAST", "def": "SAST menganalisis kode tanpa menjalankannya; DAST menguji aplikasi yang sedang berjalan."}, {"id": 178, "d": 5, "src": "N", "t": "Threat modeling", "def": "Mengidentifikasi ancaman sejak tahap desain aplikasi, misalnya dengan STRIDE."}, {"id": 179, "d": 5, "src": "N", "t": "Physical penetration test", "def": "Uji tailgating, impersonation, atau phishing terhadap staf; wajib ada izin tertulis dan scope."}];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function el(tag,attrs={},...kids){const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")n.className=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v)}for(const c of kids.flat()){if(c==null)continue;n.append(c.nodeType?c:document.createTextNode(c))}return n}
function fmt(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}

function weightedDraw(n){
  const total=Object.values(DOMAINS).reduce((a,d)=>a+d.w,0);
  const byD={};for(const q of BANK)(byD[q.d]=byD[q.d]||[]).push(q);
  let picked=[];
  for(const d in DOMAINS){const k=Math.min(byD[d].length,Math.round(n*DOMAINS[d].w/total));picked.push(...shuffle(byD[d]).slice(0,k))}
  const ids=new Set(picked.map(q=>q.id));
  const rest=shuffle(BANK.filter(q=>!ids.has(q.id)));
  while(picked.length<n&&rest.length)picked.push(rest.pop());
  return shuffle(picked.slice(0,n));
}
function prep(qs){return qs.map(q=>({...q,order:shuffle([0,1,2,3])}))}

function home(){
  clearInterval(timerId);S=null;meta.textContent="";
  const missed=store.get("missed",[]), hist=store.get("history",[]);
  app.replaceChildren(
    el("h2",{},"Choose how to practice"),
    el("p",{class:"muted"},"Exam mode mirrors the real format: one question at a time, no going back, 2-hour clock. Practice mode shows the answer and explanation after each question."),
    el("fieldset",{},el("legend",{},"Mode"),el("div",{class:"choice-row"},
      chip("mode","exam","Exam simulation",true),chip("mode","practice","Practice with feedback"),
      chip("mode","missed",`Retry missed (${missed.length})`,false,!missed.length),
      chip("mode","flash",`Flashcards (${CARDS.length})`))),
    el("fieldset",{id:"flashSet"},el("legend",{},"Cards"),el("div",{class:"choice-row"},
      chip("fset","all","All cards",true),chip("fset","todo",`Not yet known (${CARDS.length-store.get("known",[]).length})`),chip("fset","new","New in 2026 outline only"))),
    el("fieldset",{id:"countSet"},el("legend",{},"Number of questions"),el("div",{class:"choice-row"},
      chip("count","25","25"),chip("count","50","50"),chip("count","100","100",true),chip("count","125","125"),chip("count","999",`All (${BANK.length}, practice only)`))),
    el("fieldset",{id:"domSet"},el("legend",{},"Domains"),el("div",{class:"choice-row"},
      ...Object.entries(DOMAINS).map(([d,x])=>chip("dom",d,`${d}. ${x.name} (${x.w}%)`,true,false,"checkbox")))),
    el("div",{class:"actions"},el("button",{onclick:start},"Start session"),
      hist.length?el("span",{class:"muted small"},`Last session: ${hist[0].score}% on ${hist[0].n} questions (${hist[0].mode})`):null),
    el("p",{class:"muted small",style:"margin-top:16px"},"Keyboard: ",el("kbd",{},"A")," to ",el("kbd",{},"D")," or ",el("kbd",{},"1")," to ",el("kbd",{},"4")," to choose, ",el("kbd",{},"Enter")," to confirm. Flashcards: ",el("kbd",{},"Space")," flips, ",el("kbd",{},"1")," review again, ",el("kbd",{},"2")," I know this. Definitions are in Indonesian, written in our own words from the ISC2 glossary terms.")
  );
  const sync=()=>{const m=app.querySelector('input[name=mode]:checked').value;
    document.getElementById("countSet").hidden=(m==="missed"||m==="flash");
    document.getElementById("domSet").hidden=(m!=="practice"&&m!=="flash");
    document.getElementById("flashSet").hidden=(m!=="flash")};
  app.querySelectorAll('input[name=mode]').forEach(i=>i.addEventListener("change",sync));sync();
}
function chip(name,val,text,checked=false,disabled=false,type="radio"){
  return el("label",{class:"chip"},el("input",{type,name,value:val,checked:checked?"":false,disabled:disabled?"":false}),text)}

function start(){
  const mode=app.querySelector('input[name=mode]:checked').value;
  const n=+app.querySelector('input[name=count]:checked').value;
  if(mode==="flash"){startFlash();return}
  let qs;
  if(mode==="exam"){qs=weightedDraw(Math.min(n,125))}
  else if(mode==="practice"){
    const doms=[...app.querySelectorAll('input[name=dom]:checked')].map(i=>+i.value);
    if(!doms.length){alert("Select at least one domain.");return}
    qs=shuffle(BANK.filter(q=>doms.includes(q.d))).slice(0,n)}
  else{const ids=new Set(store.get("missed",[]));qs=shuffle(BANK.filter(q=>ids.has(q.id)))}
  if(!qs.length){alert("No questions match that selection.");return}
  S={mode,qs:prep(qs),i:0,answers:[],answered:false,end:mode==="exam"?Date.now()+Math.round(7200*Math.min(1,qs.length/100))*1000:null};
  if(S.end){tick();timerId=setInterval(tick,1000)}else meta.textContent="";
  render();
}
function tick(){const left=Math.max(0,Math.round((S.end-Date.now())/1000));
  meta.textContent="Time left "+fmt(left);meta.className="meta timer"+(left<600?" warn":"");
  if(left<=0){clearInterval(timerId);finish(true)}}

function render(){
  const q=S.qs[S.i];S.answered=false;
  const form=el("div",{class:"opts",role:"radiogroup","aria-label":"Answer options"});
  q.order.forEach((oi,pos)=>{
    const id="o"+pos;
    form.append(el("label",{class:"opt",for:id,"data-oi":oi},
      el("input",{type:"radio",name:"ans",id,value:oi}),
      el("span",{class:"bub","aria-hidden":"true"},LETTERS[pos]),
      el("span",{},q.o[oi])));
  });
  const btn=el("button",{id:"go",disabled:"",onclick:submit},S.mode==="exam"?(S.i===S.qs.length-1?"Submit and finish":"Confirm answer"):"Check answer");
  form.addEventListener("change",()=>btn.disabled=false);
  app.replaceChildren(
    el("div",{class:"progress"},el("i",{style:`width:${S.i/S.qs.length*100}%`})),
    el("div",{class:"qhead"},el("span",{},`Question ${S.i+1} of ${S.qs.length}`),el("span",{},`Domain ${q.d} · ${q.s}`)),
    el("p",{class:"stem"},q.q),form,el("div",{class:"actions",id:"act"},btn,
      el("button",{class:"secondary",onclick:()=>{if(confirm("End this session and see results for answered questions?"))finish(false)}},"End session")));
}
function submit(){
  const btn=document.getElementById("go");
  if(S.answered){next();return}
  const sel=app.querySelector('input[name=ans]:checked');if(!sel)return;
  const q=S.qs[S.i],pick=+sel.value,ok=pick===0;
  S.answers[S.i]={id:q.id,pick,ok};
  if(S.mode==="exam"){next();return}
  S.answered=true;
  app.querySelectorAll("label.opt").forEach(l=>{const oi=+l.dataset.oi;l.classList.add("locked");l.querySelector("input").disabled=true;
    if(oi===0)l.classList.add("ok");else if(oi===pick)l.classList.add("bad")});
  const right=LETTERS[q.order.indexOf(0)];
  app.querySelector(".opts").after(el("div",{class:"feedback"+(ok?"":" bad")},
    el("strong",{},ok?"Correct.":`Incorrect. The answer is ${right}.`),q.e));
  btn.textContent=S.i===S.qs.length-1?"See results":"Next question";btn.disabled=false;btn.focus();
}
function next(){S.i++;if(S.i>=S.qs.length)finish(false);else render()}

function finish(timeUp){
  clearInterval(timerId);meta.textContent="";meta.className="meta";
  const done=S.answers.filter(Boolean),n=done.length,c=done.filter(a=>a.ok).length;
  const pct=n?Math.round(c/n*100):0;
  let missed=new Set(store.get("missed",[]));
  done.forEach(a=>{if(a.ok)missed.delete(a.id);else missed.add(a.id)});
  store.set("missed",[...missed]);
  const hist=store.get("history",[]);if(n)hist.unshift({score:pct,n,mode:S.mode,at:Date.now()});store.set("history",hist.slice(0,20));
  const per={};done.forEach(a=>{const q=BANK.find(x=>x.id===a.id);const p=per[q.d]=per[q.d]||{c:0,n:0};p.n++;if(a.ok)p.c++});
  const rows=Object.keys(DOMAINS).filter(d=>per[d]).map(d=>{const p=per[d],r=Math.round(p.c/p.n*100);
    return el("tr",{},el("td",{},`${d}. ${DOMAINS[d].name}`),el("td",{},`${p.c}/${p.n}`),el("td",{},`${r}%`),el("td",{},el("div",{class:"bar"},el("i",{style:`width:${r}%`}))))});
  const wrong=done.filter(a=>!a.ok).map(a=>{const q=BANK.find(x=>x.id===a.id);
    return el("details",{},el("summary",{},q.q),
      el("p",{class:"ans"},el("strong",{},"Your answer: "),q.o[a.pick]),
      el("p",{class:"ans"},el("strong",{},"Correct: "),q.o[0]),
      el("p",{class:"muted"},q.e))});
  app.replaceChildren(
    el("h2",{},timeUp?"Time is up":"Session results"),
    el("p",{class:"score"},n?`${pct}%`:"No answers"),
    el("p",{class:"muted"},`${c} correct out of ${n} answered`+(n<S.qs.length?` (${S.qs.length-n} not answered)`:"")+". A common self-study rule of thumb (not an ISC2 figure) is to score 80% or more in every domain before exam day."),
    rows.length?el("table",{},el("thead",{},el("tr",{},el("th",{},"Domain"),el("th",{},"Score"),el("th",{},"%"),el("th",{},el("span",{class:"sr"},"Bar")))),el("tbody",{},rows)):null,
    wrong.length?el("div",{class:"review"},el("h3",{},`Review ${wrong.length} missed question${wrong.length>1?"s":""}`),wrong):null,
    el("div",{class:"actions"},el("button",{onclick:home},"Back to start"),
      missed.size?el("span",{class:"muted small"},`${missed.size} question${missed.size>1?"s":""} saved to Retry missed`):null));
}


let F=null;
function startFlash(){
  const doms=[...app.querySelectorAll('input[name=dom]:checked')].map(i=>+i.value);
  const set=app.querySelector('input[name=fset]:checked').value;
  const known=new Set(store.get("known",[]));
  let deck=CARDS.filter(c=>doms.includes(c.d));
  if(set==="todo")deck=deck.filter(c=>!known.has(c.id));
  if(set==="new")deck=deck.filter(c=>c.src==="N");
  if(!deck.length){alert("No cards match that selection.");return}
  S={mode:"flash"};F={deck:shuffle(deck),total:deck.length,known:0,again:0,flipped:false};meta.textContent="";
  renderCard();
}
function renderCard(){
  const c=F.deck[0];F.flipped=false;
  const face=el("button",{class:"flash",id:"card","aria-label":"Flip card",onclick:flip},
    el("p",{class:"term"},c.t),
    el("p",{class:"hint"},"Tap the card or press Space to see the definition."));
  app.replaceChildren(
    el("div",{class:"progress"},el("i",{style:`width:${F.known/F.total*100}%`})),
    el("div",{class:"qhead"},el("span",{},`${F.known} of ${F.total} known · ${F.deck.length} left`),
      el("span",{},`Domain ${c.d}`,el("span",{class:"tag"},c.src==="N"?"new 2026":"glossary"))),
    face,
    el("div",{class:"actions",id:"fact"},
      el("button",{class:"secondary",id:"againBtn",disabled:"",onclick:()=>grade(false)},"Review again"),
      el("button",{class:"ok-btn",id:"knowBtn",disabled:"",onclick:()=>grade(true)},"I know this"),
      el("button",{class:"secondary",onclick:()=>endFlash()},"End session")));
  face.focus();
}
function flip(){
  if(!F||F.flipped)return;F.flipped=true;const c=F.deck[0];
  const card=document.getElementById("card");card.querySelector(".hint").replaceWith(el("p",{class:"def"},c.def));
  document.getElementById("againBtn").disabled=false;document.getElementById("knowBtn").disabled=false;
  document.getElementById("knowBtn").focus();
}
function grade(ok){
  if(!F.flipped)return;
  const c=F.deck.shift();const known=new Set(store.get("known",[]));
  if(ok){F.known++;known.add(c.id)}else{F.again++;known.delete(c.id);F.deck.push(c)}
  store.set("known",[...known]);
  if(!F.deck.length)endFlash();else renderCard();
}
function endFlash(){
  const totalKnown=store.get("known",[]).length;
  app.replaceChildren(el("h2",{},"Flashcard session done"),
    el("p",{class:"score"},`${F.known}/${F.total}`),
    el("p",{class:"muted"},`Cards marked known this session. You asked to review ${F.again} card${F.again===1?"":"s"} again. Overall you have marked ${totalKnown} of ${CARDS.length} cards as known.`),
    el("div",{class:"actions"},el("button",{onclick:home},"Back to start")));
  F=null;S=null;
}

document.addEventListener("keydown",e=>{
  if(F){if(e.key===" "&&!F.flipped){e.preventDefault();flip()}else if(F.flipped&&(e.key==="1"))grade(false);else if(F.flipped&&e.key==="2")grade(true);return}
  if(!S||e.target.tagName==="BUTTON"&&e.key==="Enter")return;
  const k=e.key.toUpperCase();let pos=LETTERS.indexOf(k);if(pos<0&&"1234".includes(k)&&k)pos=+k-1;
  if(pos>=0&&!S.answered){const r=document.getElementById("o"+pos);if(r&&!r.disabled){r.checked=true;r.dispatchEvent(new Event("change",{bubbles:true}));r.focus()}}
  if(e.key==="Enter"){const b=document.getElementById("go");if(b&&!b.disabled){e.preventDefault();submit()}}
});
home();
</script>
